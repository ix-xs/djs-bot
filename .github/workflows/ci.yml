name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck (src)
        run: npm run typecheck
      - name: Type-level tests
        run: npm run test:types
      - name: Build (dual ESM/CJS + types)
        run: npm run build
      - name: Unit tests
        run: npm test

  package:
    # Verifies the published types resolve in CJS, ESM, node10, node16 and bundler.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Are the types wrong?
        run: npx --yes @arethetypeswrong/cli@latest --pack .
